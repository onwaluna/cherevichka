<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BC6A" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E7D36" />
    </linearGradient>
    <linearGradient id="mahoganyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C2016" />
      <stop offset="100%" stop-color="#491B12" />
    </linearGradient>
  </defs>

  <!-- Canvas Background (Parchment Bone #D7CFBE) -->
  <rect width="2400" height="3600" fill="#D7CFBE"/>

  <!-- Upper Left Deep Mahogany Block -->
  <polygon points="0,0 1450,0 1150,1500 0,1300" fill="url(#mahoganyGrad)"/>

  <!-- Upper Right Warm Cream Block -->
  <polygon points="1450,0 2400,0 2400,1700 1150,1500" fill="#FAF7EE"/>

  <!-- Bottom Right Dusty Amethyst Velvet Block -->
  <polygon points="850,1700 2400,1450 2400,3600 650,3600" fill="#937C91"/>

  <!-- Bottom Left Olive Brass Block -->
  <polygon points="0,2150 1350,1950 1150,3600 0,3600" fill="#858248"/>

  <!-- Golden Radiance Rays -->
  <g stroke="url(#goldGrad)" stroke-width="5" opacity="0.85">
    <line x1="1350" y1="1000" x2="1350" y2="150" />
    <line x1="1350" y1="1000" x2="1950" y2="400" />
    <line x1="1350" y1="1000" x2="2200" y2="1000" />
    <line x1="1350" y1="1000" x2="1950" y2="1600" />
    <line x1="1350" y1="1000" x2="1350" y2="1850" />
    <line x1="1350" y1="1000" x2="750" y2="1600" />
    <line x1="1350" y1="1000" x2="500" y2="1000" />
    <line x1="1350" y1="1000" x2="750" y2="400" />
    <line x1="1350" y1="1000" x2="1650" y2="250" />
    <line x1="1350" y1="1000" x2="2100" y2="700" />
    <line x1="1350" y1="1000" x2="2100" y2="1300" />
    <line x1="1350" y1="1000" x2="1650" y2="1750" />
    <line x1="1350" y1="1000" x2="1050" y2="1750" />
    <line x1="1350" y1="1000" x2="600" y2="1300" />
    <line x1="1350" y1="1000" x2="600" y2="700" />
    <line x1="1350" y1="1000" x2="1050" y2="250" />
  </g>

  <!-- Sun Disc -->
  <circle cx="1350" cy="1000" r="440" fill="#491B12" stroke="url(#goldGrad)" stroke-width="14"/>
  <circle cx="1350" cy="1000" r="315" fill="#858248" stroke="#E2BC6A" stroke-width="10"/>
  <circle cx="1350" cy="1000" r="185" fill="url(#goldGrad)" stroke="#FAF7EE" stroke-width="6"/>
  <circle cx="1350" cy="1000" r="80" fill="#151312"/>

  <!-- Left Zebra Panel -->
  <g>
    <polygon points="80,750 950,520 850,2250 50,2050" fill="#FAF7EE" stroke="url(#goldGrad)" stroke-width="8"/>
    <!-- Zebra Stripes -->
    <path d="M 60,620 Q 300,680 500,630 T 900,640" stroke="#151312" stroke-width="36" fill="none"/>
    <path d="M 60,740 Q 350,810 550,750 T 910,760" stroke="#151312" stroke-width="38" fill="none"/>
    <path d="M 60,860 Q 300,920 520,860 T 920,880" stroke="#151312" stroke-width="40" fill="none"/>
    <path d="M 60,990 Q 320,1050 540,990 T 910,1010" stroke="#151312" stroke-width="42" fill="none"/>
    <path d="M 60,1130 Q 340,1200 560,1130 T 900,1150" stroke="#151312" stroke-width="38" fill="none"/>
    <path d="M 60,1270 Q 310,1340 530,1280 T 890,1290" stroke="#151312" stroke-width="40" fill="none"/>
    <path d="M 60,1410 Q 330,1480 550,1420 T 880,1430" stroke="#151312" stroke-width="42" fill="none"/>
    <path d="M 60,1560 Q 300,1630 520,1570 T 870,1580" stroke="#151312" stroke-width="38" fill="none"/>
    <path d="M 60,1710 Q 320,1780 540,1720 T 860,1730" stroke="#151312" stroke-width="40" fill="none"/>
    <path d="M 60,1860 Q 310,1930 530,1870 T 850,1880" stroke="#151312" stroke-width="42" fill="none"/>
    <path d="M 60,2010 Q 330,2080 550,2020 T 840,2030" stroke="#151312" stroke-width="38" fill="none"/>
  </g>

  <!-- Right Zebra Panel -->
  <g>
    <polygon points="1400,1650 2320,1420 2320,3150 1300,2950" fill="#FAF7EE" stroke="url(#goldGrad)" stroke-width="8"/>
    <path d="M 1320,1520 Q 1600,1580 1850,1530 T 2300,1540" stroke="#151312" stroke-width="36" fill="none"/>
    <path d="M 1320,1660 Q 1650,1730 1900,1670 T 2300,1680" stroke="#151312" stroke-width="38" fill="none"/>
    <path d="M 1320,1800 Q 1600,1870 1850,1810 T 2300,1820" stroke="#151312" stroke-width="40" fill="none"/>
    <path d="M 1320,1950 Q 1630,2020 1880,1960 T 2300,1970" stroke="#151312" stroke-width="42" fill="none"/>
    <path d="M 1320,2100 Q 1610,2170 1860,2110 T 2300,2120" stroke="#151312" stroke-width="38" fill="none"/>
    <path d="M 1320,2250 Q 1640,2320 1890,2260 T 2300,2270" stroke="#151312" stroke-width="40" fill="none"/>
    <path d="M 1320,2400 Q 1620,2470 1870,2410 T 2300,2420" stroke="#151312" stroke-width="42" fill="none"/>
    <path d="M 1320,2560 Q 1650,2630 1900,2570 T 2300,2580" stroke="#151312" stroke-width="38" fill="none"/>
    <path d="M 1320,2720 Q 1610,2790 1860,2730 T 2300,2740" stroke="#151312" stroke-width="40" fill="none"/>
    <path d="M 1320,2880 Q 1640,2950 1890,2890 T 2300,2900" stroke="#151312" stroke-width="42" fill="none"/>
  </g>

  <!-- Botanical Olive Arches Array -->
  <g fill="#858248" stroke="url(#goldGrad)" stroke-width="7">
    <rect x="180" y="2650" width="110" height="360" rx="55"/>
    <rect x="320" y="2650" width="110" height="360" rx="55"/>
    <rect x="460" y="2650" width="110" height="360" rx="55"/>
    <rect x="600" y="2650" width="110" height="360" rx="55"/>
    <rect x="740" y="2650" width="110" height="360" rx="55"/>
    <rect x="880" y="2650" width="110" height="360" rx="55"/>
  </g>

  <!-- Amethyst & Mahogany Mosaic Grid -->
  <g stroke="#D7CFBE" stroke-width="3">
    <!-- Row 1 -->
    <rect x="1120" y="2280" width="85" height="85" fill="#937C91"/>
    <rect x="1215" y="2280" width="85" height="85" fill="#491B12"/>
    <rect x="1310" y="2280" width="85" height="85" fill="#937C91"/>
    <rect x="1405" y="2280" width="85" height="85" fill="#491B12"/>
    <rect x="1500" y="2280" width="85" height="85" fill="url(#goldGrad)"/>

    <!-- Row 2 -->
    <rect x="1120" y="2375" width="85" height="85" fill="#491B12"/>
    <rect x="1215" y="2375" width="85" height="85" fill="#937C91"/>
    <rect x="1310" y="2375" width="85" height="85" fill="#491B12"/>
    <rect x="1405" y="2375" width="85" height="85" fill="#937C91"/>
    <rect x="1500" y="2375" width="85" height="85" fill="#491B12"/>

    <!-- Row 3 (Center Gold) -->
    <rect x="1120" y="2470" width="85" height="85" fill="#937C91"/>
    <rect x="1215" y="2470" width="85" height="85" fill="#491B12"/>
    <rect x="1310" y="2470" width="85" height="85" fill="url(#goldGrad)"/>
    <rect x="1405" y="2470" width="85" height="85" fill="#491B12"/>
    <rect x="1500" y="2470" width="85" height="85" fill="#937C91"/>
  </g>

  <!-- Architectural Gold Grid Borders -->
  <rect x="80" y="80" width="2240" height="3440" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="110" y="110" width="2180" height="3380" fill="none" stroke="#E2BC6A" stroke-width="2"/>
  <line x1="110" y1="450" x2="2290" y2="450" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="110" y1="1600" x2="2290" y2="1600" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="110" y1="2450" x2="2290" y2="2450" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="110" x2="350" y2="3490" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="1250" y1="110" x2="1250" y2="3490" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="2050" y1="110" x2="2050" y2="3490" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
</svg>